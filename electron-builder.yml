appId: dev.contexthelper.app
productName: ContextHelper
# No auto-update: without this electron-builder infers GitHub publishing from the git remote
# and writes latest.yml / app-update.yml.
publish: null
directories:
  output: dist
files:
  - "src/**/*"
  - "plugins/**/*"
  - "package.json"
extraResources:
  - from: plugins
    to: plugins
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch: x64
  icon: null
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: ContextHelper
  artifactName: ContextHelper-Setup-${version}.${ext}
  include: build/installer.nsh
